<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veilora — Move quietly. Stay in control.</title>
    <meta name="description" content="Veilora is a threshold self-custody wallet for Robinhood Chain. Manage assets, send, receive, compare swap routes, and review transaction history." />
    <meta name="theme-color" content="#f7f8fc" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Veilora" />
    <meta property="og:title" content="Veilora — Move quietly. Stay in control." />
    <meta property="og:description" content="Plan, protect and execute digital-asset actions privately, with no single point of signing authority and no blind movement of funds." />
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Veilora wordmark and logo. Move quietly / Stay in control." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Veilora — Move quietly. Stay in control." />
    <meta name="twitter:description" content="A focused threshold self-custody wallet for Robinhood Chain." />
    <meta name="twitter:image" content="/og.jpg" />
    <script>
      // Apply the saved theme (light by default) before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("veilora:theme");
        if (t === "dark") document.documentElement.classList.add("dark");
      } catch (e) {
        document.documentElement.classList.remove("dark");
      }
    </script>
  </head>
  <body>
    <script>
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
